services:
  database:
    image: postgres:16-alpine
    container_name: hop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hop-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/hop_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_UPLOAD_DIR: /app/uploads/documents
      HOP_VIDEO_LOCAL_DIR: /app/uploads/reels
    ports:
      - "8080:8080"
    volumes:
      - hop-uploads:/app/uploads/documents
      - hop-reels:/app/uploads/reels

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  hop-uploads:
  hop-reels:
