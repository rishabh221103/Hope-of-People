spring.application.name=hop-backend-test

# In-Memory H2 Database Configuration for Test Suite
spring.datasource.url=jdbc:h2:mem:hop_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway during unit tests using H2 mock
spring.flyway.enabled=false

# JWT Security Configuration for Tests
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# File Upload Configuration for Tests
app.upload.dir=target/test-uploads
